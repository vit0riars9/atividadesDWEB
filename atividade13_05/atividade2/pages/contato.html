
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Travel World</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">

            <a class="navbar-brand fw-bold" href="../index.html">
                ✈ Travel World
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="produto.html">Pacotes</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="contato.html">Contato</a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>

    <section class="container py-5 mt-5">

        <div class="text-center mb-5">

            <h1 class="fw-bold">
                Entre em Contato
            </h1>

            <p>
                Tire suas dúvidas e fale com nossa equipe
            </p>

        </div>

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow border-0">

                    <div class="card-body p-4">

                        <form>

                            <div class="mb-3">

                                <label class="form-label">
                                    Nome
                                </label>

                                <input type="text"
                                    class="form-control"
                                    placeholder="Digite seu nome">

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                    class="form-control"
                                    placeholder="Digite seu email">

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Mensagem
                                </label>

                                <textarea
                                    class="form-control"
                                    rows="5"
                                    placeholder="Digite sua mensagem"></textarea>

                            </div>

                            <button type="submit"
                                class="btn btn-warning fw-bold w-100">

                                Enviar Mensagem

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <footer class="bg-dark text-white text-center py-4 fixed-bottom">

        <h4>Travel World</h4>

        <p>Sua próxima aventura começa aqui ✈</p>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
